     <section class="contact-section">
            <div class="contact-container">
                <h2>Contact Our Tech Experts</h2>
                <p>Have questions about compatibility, shipping, or specs? Drop us a message!</p>

                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="mahmoud mohamed" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="_replyto" placeholder="mahmoud@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="How can we help you?"
                            required></textarea>
                    </div>

                    <button type="submit" class="btn submit-btn">Send Message</button>
                </form>
            </div>
        </section>
